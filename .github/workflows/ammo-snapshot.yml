name: 三角洲子弹行情快照

# 每 10 分钟抓一次交易行，把结果写成静态 JSON 提交到仓库，
# GitHub Pages 直接读这些文件，朋友打开网页就能看，不需要你的电脑开机。

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # 每小时 6 次，错开整点避开高峰延迟
  workflow_dispatch:                      # 也可以在 Actions 页面手动点一次

permissions:
  contents: write

concurrency:
  group: ammo-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 同步前端页面（以 web/index.html 为准）
        run: |
          if [ -f web/index.html ]; then
            mkdir -p ammo
            cp web/index.html ammo/index.html
          fi

      - name: 抓取并生成静态数据
        run: python scripts/ammo_static_build.py --out ammo/data

      - name: 提交
        run: |
          git config user.name "ammo-snapshot-bot"
          git config user.email "ammo-snapshot-bot@users.noreply.github.com"
          git add ammo
          if git diff --cached --quiet; then
            echo "数据没有变化，跳过提交"
            exit 0
          fi
          git commit -m "data: 子弹行情快照 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "推送失败，下次运行会再试"
          exit 1

